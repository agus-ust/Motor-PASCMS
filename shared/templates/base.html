<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Motor PAS + CMS{% endblock %}</title>
  <!-- Day 1: download Bootstrap and HTMX into shared/static/vendor so the demo works with no internet. -->
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  <nav class="d-flex justify-content-between align-items-center px-4 py-2" style="background:#fff;border-bottom:1px solid var(--line)">
    <strong style="color:var(--brand)">Motor PAS + CMS</strong>
    <span>Role: <span class="pill pill-ok">{{ role or "not signed in" }}</span></span>
  </nav>
  <main class="container py-4">{% block content %}{% endblock %}</main>
  <div class="proto-footer">PROTOTYPE - illustrative rates and mocked integrations. Not for production or real policyholder data.</div>
</body>
</html>
